<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX07 — Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">INSPIRAÇÃO VISUAL</p><h1>Galeria de fotografias</h1><p>Uma grelha responsiva com imagens de diferentes dimensões.</p></header>
    <section class="galeria">
      <figure class="grande"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80" alt="Montanhas e paisagem ao pôr do sol"><figcaption>Horizontes</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lago rodeado de montanhas"><figcaption>Natureza</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Floresta verde"><figcaption>Floresta</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="Praia com mar azul"><figcaption>Oceano</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=700&q=80" alt="Ondas do mar"><figcaption>Ondas</figcaption></figure>
      <figure class="largo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80" alt="Cordilheira de montanhas"><figcaption>Montanhas</figcaption></figure>
    </section>
  </main>
</body>
</html>
