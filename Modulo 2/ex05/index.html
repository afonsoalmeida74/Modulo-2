<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX05 — Flexbox Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Flexbox Playground</h1>
    <section><h2>1. Linha e justify-content: space-between</h2><div class="flex demo1"><div>A</div><div>B</div><div>C</div></div></section>
    <section><h2>2. Coluna</h2><div class="flex demo2"><div>A</div><div>B</div><div>C</div></div></section>
    <section><h2>3. Wrap e gap</h2><div class="flex demo3"><div>Cartão 1</div><div>Cartão 2</div><div>Cartão 3</div><div>Cartão 4</div><div>Cartão 5</div></div></section>
    <section><h2>4. Align-items: center</h2><div class="flex demo4"><div>Baixo</div><div class="alto">Alto</div><div>Baixo</div></div></section>
    <section><h2>5. Flex-grow e flex-shrink</h2><div class="flex demo5"><div class="grow">Grow 2</div><div class="grow-normal">Grow 1</div><div class="shrink">Shrink</div></div></section>
    <section><h2>Extra: navegação</h2><nav class="navbar"><strong>FlexSite</strong><a href="#">Início</a><a href="#">Projetos</a><a href="#">Contacto</a></nav></section>
  </main>
</body>
</html>
