<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX04 — Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Componentes CSS</h1>
    <section class="cards">
      <article class="card"><span class="badge">Novo</span><h2>Cartão de exemplo</h2><p>Um componente reutilizável com espaçamento e bordas consistentes.</p><button class="btn">Saber mais</button></article>
      <article class="card"><h2>Alertas</h2><div class="alert success">Operação concluída com sucesso.</div><div class="alert warning">Atenção: verifica os dados.</div><div class="alert error">Ocorreu um erro.</div></article>
    </section>
    <section class="form-card">
      <h2>Formulário</h2>
      <form>
        <label for="nome">Nome</label><input id="nome" name="nome" type="text" placeholder="O teu nome" required>
        <label for="email">Email</label><input id="email" name="email" type="email" placeholder="nome@exemplo.pt" required>
        <label for="assunto">Assunto</label><select id="assunto" name="assunto"><option>Dúvida</option><option>Sugestão</option></select>
        <button class="btn" type="submit">Enviar</button>
      </form>
    </section>
  </main>
</body>
</html>
